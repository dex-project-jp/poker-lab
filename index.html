<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Poker Lab</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111827;color:#f9fafb;margin:0;padding:14px;max-width:700px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}button,select,input{font:inherit;border:0;border-radius:8px;padding:10px;background:#374151;color:white}button.active{background:#e9a53d;color:#111827}.buttons{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.buttons button{flex:1;padding:10px 3px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px}.cell{font-size:clamp(8px,2.25vw,12px);padding:0;aspect-ratio:1;min-width:0;border-radius:2px;background:#374151;color:white;font-weight:600}.cell.selected{outline:2px solid #e9a53d;outline-offset:-2px}.panel{background:#1f2937;padding:12px;border-radius:12px;margin:12px 0}.hidden{display:none}.legend{font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.dot{display:inline-block;width:10px;height:10px;margin-right:4px}.notice{font-size:12px;color:#cbd5e1}label{display:block;margin:8px 0}</style></head><body><header><div><b>POKER LAB</b><div class="notice">MTT · PREFLOP</div></div><button id="toggle">⚙ 詳細設定</button></header><p>自分のポジション</p><div class="buttons" id="positions"></div><div class="panel">状況：<select id="scenario"><option value="open">全員フォールド</option><option value="vsopen">相手がオープン</option><option value="vs3bet">3ベットに直面</option><option value="vs4bet">4ベットに直面</option></select><div style="margin-top:10px">有効スタック：<b id="stackLabel">30 BB</b></div></div><div class="panel hidden" id="settings"><label>自分のスタック（Hero / BB）<input id="heroStack" type="number" min="0.5" max="500" step=".5" value="30"></label><label>相手のスタック（Villain / BB）<input id="villainStack" type="number" min="0.5" max="500" step=".5" value="30"></label><label>アンティ <select id="ante"><option>BBアンティ</option><option>なし</option><option>全員アンティ</option></select></label><label>テーブル人数 <select id="players"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option selected>9</option><option>10</option></select></label><label>相手位置 <select id="villain"></select></label><p class="notice">※有効スタックはHeroとVillainの小さい方。複数人参加時やICMの計算は未対応。</p><button id="close">閉じる</button></div><h3>ハンドレンジ</h3><div class="legend"><span><i class="dot" style="background:#9457d5"></i>All-in</span><span><i class="dot" style="background:#e9a53d"></i>Raise</span><span><i class="dot" style="background:#399dd5"></i>Call</span><span><i class="dot" style="background:#36b9a5"></i>Check</span><span><i class="dot" style="background:#a7afba"></i>Fold</span></div><div class="grid" id="grid"></div><div class="panel"><b id="selected">KQo</b><p>GTOレンジデータ未接続：頻度はまだ表示できません。</p><div class="notice" id="context"></div></div><p class="notice">操作テスト版。マスの色はGTO戦略を示しません。正確なソルバーデータを導入するまでGTO判断には使わないでください。</p><script>
const ranks='AKQJT98765432';const $=id=>document.getElementById(id);let pos='BTN',hand='KQo';
function positionList(n){if(n===2)return ['BTN/SB','BB'];if(n===3)return ['BTN','SB','BB'];if(n===4)return ['CO','BTN','SB','BB'];if(n===5)return ['HJ','CO','BTN','SB','BB'];const early=n-5;const a=[];for(let i=0;i<early;i++){if(i===0)a.push('UTG');else if(i===early-1&&early>2)a.push('LJ');else a.push('UTG+'+i)}return [...a,'HJ','CO','BTN','SB','BB'].slice(-(n));}
function validStack(id){let n=Number($(id).value);return Number.isFinite(n)&&n>=0.5?n:null}
function rebuildPositions(){const n=Number($('players').value),p=positionList(n),oldV=$('villain').value;pos=p.includes(pos)?pos:(p.includes('BTN')?'BTN':p[0]);$('positions').replaceChildren();p.forEach(name=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{pos=name;rebuildVillain();update()};$('positions').append(b)});rebuildVillain(oldV);update()}
function rebuildVillain(preferred){const p=positionList(Number($('players').value));const candidates=p.filter(x=>x!==pos);const old=preferred||$('villain').value;$('villain').replaceChildren();candidates.forEach(name=>{const o=document.createElement('option');o.value=name;o.textContent=name;$('villain').append(o)});$('villain').value=candidates.includes(old)?old:candidates[0]}
function update(){const a=validStack('heroStack'),b=validStack('villainStack'),effective=a===null||b===null?null:Math.min(a,b);$('stackLabel').textContent=effective===null?'入力を確認':effective+' BB';$('selected').textContent=hand;$('context').textContent=pos+' / '+$('players').value+'人 / Hero '+(a??'—')+'BB / Villain '+(b??'—')+'BB / '+$('scenario').selectedOptions[0].text;document.querySelectorAll('.cell').forEach(el=>el.classList.toggle('selected',el.textContent===hand));document.querySelectorAll('#positions button').forEach(el=>el.classList.toggle('active',el.textContent===pos))}
for(let i=0;i<13;i++)for(let j=0;j<13;j++){const h=i===j?ranks[i]+ranks[j]:i<j?ranks[i]+ranks[j]+'s':ranks[j]+ranks[i]+'o';const b=document.createElement('button');b.className='cell';b.textContent=h;b.onclick=()=>{hand=h;update()};$('grid').append(b)}
$('toggle').onclick=()=>{$('settings').classList.toggle('hidden')};$('close').onclick=()=>{$('settings').classList.add('hidden')};$('players').onchange=rebuildPositions;['heroStack','villainStack','scenario','ante','villain'].forEach(id=>{$(id).onchange=update;$(id).oninput=update});rebuildPositions();
</script></body></html>
