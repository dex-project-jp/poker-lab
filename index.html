<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Poker Lab</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111827;color:#f9fafb;margin:0;padding:14px;max-width:700px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}button,select,input{font:inherit;border:0;border-radius:8px;padding:10px;background:#374151;color:white}button.active{background:#e9a53d;color:#111827}.buttons{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.buttons button{flex:1;padding:10px 3px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px}.cell{font-size:clamp(8px,2.25vw,12px);padding:0;aspect-ratio:1;min-width:0;border-radius:2px;background:#374151;color:white;font-weight:600}.cell.selected{outline:2px solid #e9a53d;outline-offset:-2px}.panel{background:#1f2937;padding:12px;border-radius:12px;margin:12px 0}.hidden{display:none}.legend{font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.dot{display:inline-block;width:10px;height:10px;margin-right:4px}.notice{font-size:12px;color:#cbd5e1}label{display:block;margin:8px 0}</style></head><body><header><div><b>POKER LAB</b><div class="notice">MTT · PREFLOP</div></div><button id="toggle">⚙ 詳細設定</button></header><p>自分のポジション</p><div class="buttons" id="positions"></div><div class="panel">状況：<select id="scenario"><option value="open">全員フォールド</option><option value="vsopen">相手がオープン</option><option value="vs3bet">3ベットに直面</option><option value="vs4bet">4ベットに直面</option></select><div style="margin-top:10px">有効スタック：<b id="stackLabel">30 BB</b></div></div><div class="panel hidden" id="settings"><label>スタック（BB）<input id="stack" type="number" min="1" max="500" step=".5" value="30"></label><label>アンティ <select id="ante"><option>BBアンティ</option><option>なし</option><option>全員アンティ</option></select></label><label>人数 <select id="players"><option>9</option><option>8</option><option>6</option></select></label><label>相手位置 <select id="villain"><option>UTG</option><option>HJ</option><option>CO</option><option>BTN</option><option>SB</option><option>BB</option></select></label><button id="close">閉じる</button></div><h3>ハンドレンジ</h3><div class="legend"><span><i class="dot" style="background:#9457d5"></i>All-in</span><span><i class="dot" style="background:#e9a53d"></i>Raise</span><span><i class="dot" style="background:#399dd5"></i>Call</span><span><i class="dot" style="background:#36b9a5"></i>Check</span><span><i class="dot" style="background:#a7afba"></i>Fold</span></div><div class="grid" id="grid"></div><div class="panel"><b id="selected">KQo</b><p>GTOレンジデータ未接続：頻度はまだ表示できません。</p><div class="notice" id="context"></div></div><p class="notice">操作テスト版。マスの色はGTO戦略を示しません。正確なソルバーデータを導入するまでGTO判断には使わないでください。</p><script>const ranks='AKQJT98765432',positions=['UTG','UTG+1','HJ','CO','BTN','SB','BB'];let pos='BTN',hand='KQo';const $=id=>document.getElementById(id);function update(){$('stackLabel').textContent=$('stack').value+' BB';$('selected').textContent=hand;$('context').textContent=pos+' / '+$('stack').value+'BB / '+$('scenario').selectedOptions[0].text;document.querySelectorAll('.cell').forEach(el=>el.classList.toggle('selected',el.textContent===hand));document.querySelectorAll('#positions button').forEach(el=>el.classList.toggle('active',el.textContent===pos))}positions.forEach(p=>{const b=document.createElement('button');b.textContent=p;b.onclick=()=>{pos=p;update()};$('positions').append(b)});for(let i=0;i<13;i++)for(let j=0;j<13;j++){const h=i===j?ranks[i]+ranks[j]:i<j?ranks[i]+ranks[j]+'s':ranks[j]+ranks[i]+'o';const b=document.createElement('button');b.className='cell';b.textContent=h;b.onclick=()=>{hand=h;update()};$('grid').append(b)}$('toggle').onclick=()=>{$('settings').classList.toggle('hidden')};$('close').onclick=()=>{$('settings').classList.add('hidden')};['stack','scenario','ante','players','villain'].forEach(id=>$(id).onchange=update);update();</script></body></html>
