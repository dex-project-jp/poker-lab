<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Poker Lab</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111827;color:#f9fafb;margin:0;padding:14px;max-width:700px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}button,select,input{font:inherit;border:0;border-radius:8px;padding:10px;background:#374151;color:white}button.active{background:#e9a53d;color:#111827}.buttons{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.buttons button{flex:1;padding:10px 3px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px}.cell{font-size:clamp(8px,2.25vw,12px);padding:0;aspect-ratio:1;min-width:0;border-radius:2px;background:#374151;color:white;font-weight:600}.cell.selected{outline:2px solid #e9a53d;outline-offset:-2px}.panel{background:#1f2937;padding:12px;border-radius:12px;margin:12px 0}.hidden{display:none}.legend{font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.dot{display:inline-block;width:10px;height:10px;margin-right:4px}.notice{font-size:12px;color:#cbd5e1}label{display:block;margin:8px 0}.tableHead{display:flex;justify-content:space-between;width:100%;background:#243247;text-align:left;font-weight:700;margin-top:14px}.tableWrap{background:#1f2937;border-radius:15px;padding:12px;margin:8px 0}.felt{position:relative;height:300px;max-width:480px;margin:auto}.oval{position:absolute;inset:55px 48px;border-radius:50%;background:radial-gradient(ellipse,#176d59,#10513f);border:5px solid #3b8873;display:flex;align-items:center;justify-content:center;color:#a9e8d5;font-size:12px;letter-spacing:2px}.seat{position:absolute;transform:translate(-50%,-50%);width:24%;max-width:108px;padding:6px 2px;background:#35445b;border:2px solid transparent;border-radius:9px;text-align:center;font-size:11px;line-height:1.3;z-index:1}.seat small{display:block;font-size:10px;color:#d0d9e7}.seat.hero{background:#e9a53d;color:#151c2b;border-color:#ffe1a3}.seat.hero small{color:#222}.seat.villain{border-color:#60b8f0}.seat.editing{outline:2px solid white}.editBox{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:8px}.editBox input{width:90px;text-align:center}.editBox button{background:#e9a53d;color:#111827;font-weight:700}.tableHint{text-align:center;color:#b5c2d2;font-size:11px;margin-top:8px}@media(max-width:390px){.seat{font-size:10px}.felt{height:270px}.oval{inset:52px 42px}}</style></head><body><header><div><b>POKER LAB</b><div class="notice">MTT · PREFLOP</div></div><button id="toggle">⚙ 詳細設定</button></header><p>自分のポジション</p><div class="buttons" id="positions"></div><div class="panel">状況：<select id="scenario"><option value="open">全員フォールド</option><option value="vsopen">相手がオープン</option><option value="vs3bet">3ベットに直面</option><option value="vs4bet">4ベットに直面</option></select><div style="margin-top:10px">有効スタック：<b id="stackLabel">30 BB</b></div></div><div class="panel hidden" id="settings"><label>自分のスタック（Hero / BB）<input id="heroStack" type="number" min="0.5" max="500" step=".5" value="30"></label><label>相手のスタック（Villain / BB）<input id="villainStack" type="number" min="0.5" max="500" step=".5" value="30"></label><label>アンティ <select id="ante"><option>BBアンティ</option><option>なし</option><option>全員アンティ</option></select></label><label>テーブル人数 <select id="players"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option selected>9</option><option>10</option></select></label><label>相手位置 <select id="villain"></select></label><p class="notice">※有効スタックはHeroとVillainの小さい方。複数人参加時やICMの計算は未対応。</p><button id="close">閉じる</button></div><h3>ハンドレンジ</h3><div class="legend"><span><i class="dot" style="background:#9457d5"></i>All-in</span><span><i class="dot" style="background:#e9a53d"></i>Raise</span><span><i class="dot" style="background:#399dd5"></i>Call</span><span><i class="dot" style="background:#36b9a5"></i>Check</span><span><i class="dot" style="background:#a7afba"></i>Fold</span></div><div class="grid" id="grid"></div><div class="panel"><b id="selected">KQo</b><p>GTOレンジデータ未接続：頻度はまだ表示できません。</p><div class="notice" id="context"></div></div><button id="tableToggle" class="tableHead" aria-expanded="false">♠ テーブル表示（全員のスタック） <span id="tableArrow">＋</span></button><section id="tableSection" class="tableWrap hidden"><div id="felt" class="felt"><div class="oval">POKER LAB</div></div><div id="editBox" class="editBox hidden"><strong id="editName"></strong><input id="seatInput" type="number" min="0.5" max="500" step="0.5" inputmode="decimal" aria-label="スタックBB"><span>BB</span><button id="saveSeat">保存</button></div><div class="tableHint">席をタップしてスタックを編集 · 青枠は相手</div></section><p class="notice">操作テスト版。マスの色はGTO戦略を示しません。正確なソルバーデータを導入するまでGTO判断には使わないでください。</p><script>
const ranks='AKQJT98765432',$=id=>document.getElementById(id);let pos='BTN',hand='KQo',editing=null,heroStack=30;const stacks={};
function positionList(n){if(n===2)return ['BTN/SB','BB'];if(n===3)return ['BTN','SB','BB'];if(n===4)return ['CO','BTN','SB','BB'];if(n===5)return ['HJ','CO','BTN','SB','BB'];const early=n-5,a=[];for(let i=0;i<early;i++)a.push(i===0?'UTG':i===early-1&&early>2?'LJ':'UTG+'+i);return [...a,'HJ','CO','BTN','SB','BB']}
function valid(v){const n=Number(v);return v!==''&&Number.isFinite(n)&&n>=0.5&&n<=500?n:null}
function villain(){return $('villain').value}
function rebuildVillain(preferred){const candidates=positionList(Number($('players').value)).filter(x=>x!==pos),old=preferred||villain();$('villain').replaceChildren();candidates.forEach(name=>{const o=document.createElement('option');o.value=name;o.textContent=name;$('villain').append(o)});$('villain').value=candidates.includes(old)?old:candidates[0];$('villainStack').value=stacks[villain()]??30}
function hideEditor(){editing=null;$('editBox').classList.add('hidden')}
function rebuildPositions(){const p=positionList(Number($('players').value)),old=villain();pos=p.includes(pos)?pos:(p.includes('BTN')?'BTN':p[0]);$('positions').replaceChildren();p.forEach(name=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{if(pos!==name){pos=name;hideEditor();rebuildVillain();update()}};$('positions').append(b)});rebuildVillain(old);update()}
function editSeat(name){editing=name;$('editName').textContent=name===pos?'HERO · '+name:name;$('seatInput').value=name===pos?heroStack:(stacks[name]??30);$('editBox').classList.remove('hidden');renderTable();$('seatInput').focus()}
function renderTable(){const p=positionList(Number($('players').value)),n=p.length,felt=$('felt');felt.querySelectorAll('.seat').forEach(x=>x.remove());p.forEach((name,i)=>{const theta=(-90+360*i/n)*Math.PI/180,x=50+43*Math.cos(theta),y=50+42*Math.sin(theta),b=document.createElement('button');b.className='seat'+(name===pos?' hero':'')+(name===villain()?' villain':'')+(editing===name?' editing':'');b.style.left=x+'%';b.style.top=y+'%';const small=document.createElement('small');small.textContent=name+(name===pos?' · HERO':'');b.append(small,document.createTextNode((name===pos?heroStack:stacks[name]??30)+' BB'));b.onclick=()=>editSeat(name);felt.append(b)})}
function update(){const a=valid($('heroStack').value),v=villain(),b=valid($('villainStack').value);if(a!==null)heroStack=a;if(b!==null&&v)stacks[v]=b;const eff=a===null||b===null?null:Math.min(a,b);$('stackLabel').textContent=eff===null?'入力を確認':eff+' BB';$('selected').textContent=hand;$('context').textContent=pos+' / '+$('players').value+'人 / Hero '+(a??'—')+'BB / Villain '+(b??'—')+'BB / '+$('scenario').selectedOptions[0].text;document.querySelectorAll('.cell').forEach(el=>el.classList.toggle('selected',el.textContent===hand));document.querySelectorAll('#positions button').forEach(el=>el.classList.toggle('active',el.textContent===pos));renderTable()}
for(let i=0;i<13;i++)for(let j=0;j<13;j++){const h=i===j?ranks[i]+ranks[j]:i<j?ranks[i]+ranks[j]+'s':ranks[j]+ranks[i]+'o';const b=document.createElement('button');b.className='cell';b.textContent=h;b.onclick=()=>{hand=h;update()};$('grid').append(b)}
$('toggle').onclick=()=>{$('settings').classList.toggle('hidden')};$('close').onclick=()=>{$('settings').classList.add('hidden')};$('tableToggle').onclick=()=>{const opened=!$('tableSection').classList.toggle('hidden');$('tableToggle').setAttribute('aria-expanded',String(opened));$('tableArrow').textContent=opened?'−':'＋';if(!opened)hideEditor()};
$('saveSeat').onclick=()=>{const v=valid($('seatInput').value);if(v===null){alert('0.5〜500 BBで入力してください');return}if(editing===pos){heroStack=v;$('heroStack').value=v}else{stacks[editing]=v;if(editing===villain())$('villainStack').value=v}hideEditor();update()};
$('players').onchange=rebuildPositions;$('villain').onchange=()=>{$('villainStack').value=stacks[villain()]??30;update()};['heroStack','villainStack','scenario','ante'].forEach(id=>{$(id).onchange=update;$(id).oninput=update});rebuildPositions();</script></body></html>
