name: Solver validation
on:
  push:
    paths:
      - 'solver/**'
      - 'index.html'
      - 'app/**'
      - 'version.json'
      - '.github/workflows/solver-tests.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      regenerate:
        description: 'Re-enumerate all 47,008 exact matchups (several minutes)'
        type: boolean
        default: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install scipy==1.17.0
      - name: Run all solver tests
        run: npm test --prefix solver
      - name: Detect changes to HU math and certified data
        id: scope
        run: |
          python - <<'PYTHON'
          import os, subprocess
          try:
              files = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines()
          except subprocess.CalledProcessError:
              files = ['solver/game.js']
          mtt_only = {'solver/mtt-model.js', 'solver/mtt.test.mjs', 'solver/tools/mtt-status.mjs', 'solver/tools/check-mtt-bundle.mjs', 'solver/tools/browser-check.cjs'}
          hu_math = any(p.startswith('solver/') and p not in mtt_only and 'practical' not in p and p != 'solver/package.json' and not p.startswith('solver/btn-mini') and '/btn-mini' not in p and 'btn-mini' not in p and not p.startswith('solver/data/mtt') and 'mtt10' not in p and 'multiplayer' not in p for p in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('hu_math=' + str(hu_math).lower() + '\n')
          PYTHON
      - name: Recompute independent LP and JS exact cross-checks
        if: steps.scope.outputs.hu_math == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd solver
          npm run solve:lp -- --check
          npm run solve:range -- --check
          npm run check:equities
          npm run check:evaluator
          npm run certify
          npm run certify:range
          git diff --exit-code -- data/
      - name: Independently verify the restricted BTN three-player game
        run: |
          cd solver
          npm run export:btn-mini
          npm run check:btn-mini -- --check
          npm run certify:btn-mini
          git diff --exit-code -- data/btn-mini-strategy.js data/btn-mini-validation.json
      - name: Independently verify all nine restricted-game best responses
        run: |
          cd solver
          npm run export:mtt10
          npm run check:mtt10 -- --check
          npm run certify:mtt10
          git diff --exit-code -- data/mtt10-strategy.js data/mtt10-validation.json
      - name: Verify conditional all-in audit and source data
        run: |
          npm run audit:practical --prefix solver -- --check
          node solver/tools/practical-audit-monte-carlo.mjs --check
      - name: Verify MTT availability report
        run: |
          npm run status:practical --prefix solver
          git diff --exit-code -- solver/data/practical30-summary.json
          npm run status:mtt --prefix solver
          git diff --exit-code -- solver/data/mtt30-status.json
      - name: Re-enumerate entire exact matrix
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerate }}
        run: npm run regenerate --prefix solver
  mobile-ui:
    strategy:
      matrix:
        browser: [chromium, webkit]
    env:
      POKER_BROWSER: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check mobile interactions and fail-closed display
        run: node solver/tools/browser-check.cjs
