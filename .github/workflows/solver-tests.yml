name: Solver unit tests
on:
  push:
    paths:
      - 'solver/**'
      - '.github/workflows/solver-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run solver tests
        run: cd solver && npm test
